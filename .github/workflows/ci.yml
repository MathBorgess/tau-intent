name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: test (offline)
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
        env:
          NO_NETWORK: "1"
      - name: pin check
        run: PYTHONPATH=src python3 -m tau_intent.pin --check
        env:
          NO_NETWORK: "1"
