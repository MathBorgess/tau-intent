# v1 projection. Read, never fitted. Hashed in the manifest.
# Selection declared in P-0: relevance-only, greedy by value/cost, singleton
# fallback. No coverage term, no diversity term, no facility location.
selecao: relevancia-guloso-por-razao+singleton
gamma: 0.1
max_nodes: 200
lambda_grau: 3.0
prune_hubs: true
llm_rescue: false
up_depth: 1
down_depth: 1
token_budget: 1500
peso_tipo_com_property: 1.0
peso_tipo_sem_property: 0.7
# Ablation keys. Off in v1; turning one on is an experiment, not a default.
repr: false
div: false
